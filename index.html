<title>Calculadora de Peajes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna tipo app. Formulario arriba, resultado (total + mapa + lista de peajes) abajo.
   Estética: cartelería vial argentina (verde de ruta, ámbar de cabina), tipografía condensada para cifras. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --fg:#15201B; --muted:#5B6A62; --line:#D8DED7;
  --accent:#0A6A4A; --accent-fg:#FFFFFF; --toll:#E3A30B; --pin-b:#C2410C;
  --warn-bg:#FFF4D6; --warn-fg:#5A4300; --map-bg:#E6EBE4; --map-grid:#D2DBD0;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18211C; --fg:#E8EFEA; --muted:#93A59A; --line:#2A372F;
    --accent:#3FBF8A; --accent-fg:#07140D; --toll:#F0B52A; --pin-b:#F28A55;
    --warn-bg:#2D2508; --warn-fg:#F2D98A; --map-bg:#1B2620; --map-grid:#25332B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --fg:#E8EFEA; --muted:#93A59A; --line:#2A372F;
  --accent:#3FBF8A; --accent-fg:#07140D; --toll:#F0B52A; --pin-b:#F28A55;
  --warn-bg:#2D2508; --warn-fg:#F2D98A; --map-bg:#1B2620; --map-grid:#25332B; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
.app{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
.sign{align-self:flex-start;background:var(--accent);color:var(--accent-fg);font-family:var(--font-display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;padding:4px 14px 2px;border-radius:4px;border:2px solid var(--accent-fg);outline:2px solid var(--accent)}
header p{margin:6px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
@media (max-width:520px){.row{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
input[type=text],select,textarea{font:inherit;font-size:1rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--toll);outline-offset:2px}
.checks{display:flex;flex-direction:column}
.check{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:1rem;font-weight:500;color:var(--fg);padding-block:6px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
button{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:11px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:1.05rem}
button:disabled{opacity:.6;cursor:progress}
.swap{padding:10px 12px}
.ai h2,.result h2{margin:0;font-family:var(--font-display);font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase}
.ai small,.hint{color:var(--muted);font-size:.85rem}
.status{min-height:1.2em;font-size:.9rem;color:var(--muted)}
.status.error{color:var(--pin-b);font-weight:600}
.banner{background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:10px 12px;font-size:.88rem}
.total{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.total .amount{font-family:var(--font-display);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.total .meta{color:var(--muted);font-variant-numeric:tabular-nums}
.mapwrap{position:relative;display:block;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg);color:inherit;text-decoration:none}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap .go{position:absolute;left:10px;bottom:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem}
.mapwrap:hover .go{background:var(--accent);color:var(--accent-fg)}
.tolls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tolls li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tolls li:first-child{border-top:0}
.km{font-family:var(--font-display);font-weight:600;font-size:1.05rem;min-width:3.6em;color:var(--muted);font-variant-numeric:tabular-nums}
.tn{min-width:0}
.tn b{display:block;font-weight:600;overflow-wrap:anywhere}
.tn span{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.price{font-family:var(--font-display);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding-block:8px}
.pill{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
/* mapa */
.m-grid{stroke:var(--map-grid);stroke-width:1}
.m-route-casing{fill:none;stroke:var(--surface);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.m-route{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.m-toll{fill:var(--toll);stroke:var(--fg);stroke-width:1.5}
.m-toll.est{fill:var(--surface);stroke-dasharray:3 2}
.m-a{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.m-b{fill:var(--pin-b);stroke:var(--surface);stroke-width:2.5}
.m-pin-t{font:700 13px var(--font-body);fill:#fff;text-anchor:middle}
.m-attr{font:11px var(--font-body);fill:var(--muted);text-anchor:end}
.m-city{fill:var(--muted)}
.m-city-t{font:11px var(--font-body);fill:var(--muted);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px}
@media (prefers-reduced-motion:no-preference){button,.mapwrap .go{transition:background .15s,color .15s}}
</style>

<div class="app">
  <header>
    <div class="sign">Calculadora de peajes</div>
    <p>Elegí de dónde salís y adónde vas. Se suman los peajes que quedan sobre la ruta.</p>
  </header>

  <form class="panel" id="form" autocomplete="off">
    <div class="row">
      <label for="from">Desde
        <input type="text" id="from" list="cities" value="Buenos Aires" placeholder="Ciudad o dirección">
      </label>
      <button type="button" class="swap" id="swap" aria-label="Invertir origen y destino">⇄</button>
      <label for="to">Hasta
        <input type="text" id="to" list="cities" value="Rosario" placeholder="Ciudad o dirección">
      </label>
    </div>
    <div class="opts">
      <label for="pay">Forma de pago
        <select id="pay">
          <option value="manual">Efectivo o sin beneficio</option>
          <option value="telepase">TelePASE o beneficio</option>
        </select>
      </label>
      <div class="checks">
        <label class="check" for="round"><input type="checkbox" id="round"> Ida y vuelta</label>
        <label class="check" for="peak"><input type="checkbox" id="peak"> Horario pico</label>
      </div>
    </div>
    <button type="submit" class="primary" id="go">Calcular peajes</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <datalist id="cities"></datalist>
  </form>

  <section class="panel ai" id="ai">
    <h2>Contá tu viaje</h2>
    <label for="ai-text">Escribilo como se lo dirías a alguien
      <textarea id="ai-text" placeholder="Ej: voy de Rosario a Córdoba con TelePASE, ida y vuelta"></textarea>
    </label>
    <button type="button" id="ai-go">Interpretar y calcular</button>
    <small id="ai-mode"></small>
  </section>

  <section class="panel result" id="result" hidden>
    <h2>Resultado</h2>
    <div class="total">
      <span class="amount" id="r-total"></span>
      <span class="meta" id="r-meta"></span>
    </div>
    <div class="banner" id="r-banner" hidden></div>
    <a class="mapwrap" id="r-map" href="#" target="_blank" rel="noopener" aria-label="Abrir la ruta en Google Maps">
      <div id="r-svg"></div>
      <span class="go">Ver detalle en Google Maps ↗</span>
    </a>
    <ul class="tolls" id="r-list"></ul>
    <div class="hint" id="r-note"></div>
  </section>
</div>

  ['Buenos Aires','~Ituzaingó'],['~Ituzaingó','~Malvinas'],['~Malvinas','Luján'],['Luján','Mercedes'],['Mercedes','Junín'],['Junín','Río Cuarto'],
  ['Córdoba','Santiago del Estero'],['Santiago del Estero','Tucumán'],
  ['Buenos Aires','Las Flores'],['Las Flores','Azul'],['Azul','Bahía Blanca'],['Bahía Blanca','Neuquén'],
  ['Zárate','Gualeguaychú'],['Gualeguaychú','Concordia']
];

/* ========= LÓGICA ========= */
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();

function findCity(text){
  const q = norm(text); if(!q) return null;
  let hit = CITIES.find(c => norm(c.n) === q || c.a.includes(q));
  if(!hit && q.length >= 3) hit = CITIES.find(c => norm(c.n).startsWith(q));
  if(!hit && q.length >= 4) hit = CITIES.find(c => norm(c.n).includes(q));
  return hit || null;
}

function hav(lat1,lon1,lat2,lon2){
  const R=6371, r=Math.PI/180, dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function offlineRoute(a,b){
  const ALL = CITIES.concat(WAYPOINTS);
  const byName = Object.fromEntries(ALL.map(c=>[c.n,c]));
  const adj = {}; ALL.forEach(c=>adj[c.n]=[]);
  EDGES.forEach(([x,y])=>{ const d=hav(byName[x].lat,byName[x].lon,byName[y].lat,byName[y].lon); adj[x].push([y,d]); adj[y].push([x,d]); });
  const nearest = p => CITIES.reduce((m,c)=> hav(p.lat,p.lon,c.lat,c.lon) < hav(p.lat,p.lon,m.lat,m.lon) ? c : m);
  const s = nearest(a).n, t = nearest(b).n;
  const dist = {}, prev = {}, todo = new Set(ALL.map(c=>c.n));
  ALL.forEach(c=>dist[c.n]=Infinity); dist[s]=0;
  while(todo.size){
    let u=null; todo.forEach(n=>{ if(u===null || dist[n]<dist[u]) u=n; });
    if(dist[u]===Infinity) break;
    todo.delete(u);
    adj[u].forEach(([v,d])=>{ if(dist[u]+d<dist[v]){ dist[v]=dist[u]+d; prev[v]=u; } });
  }
  const path=[]; for(let n=t; n; n=prev[n]) path.unshift(n);
  if(path[0]!==s) path.length=0;
  const nodes = path.map(n=>[byName[n].lat,byName[n].lon]);
  const coords = [[a.lat,a.lon], ...nodes, [b.lat,b.lon]];
  let km=0; for(let i=1;i<coords.length;i++) km+=hav(coords[i-1][0],coords[i-1][1],coords[i][0],coords[i][1]);
  km*=1.18;
  return { coords, km, min: km/75*60, source:'aprox' };
}

// Peajes que quedan sobre la ruta, ordenados por posición. coords = [[lat,lon],...]
// Cada cabina usa su propio radio (km); las estimadas traen uno más grande.
function tollsOnRoute(coords, tolls, tolKm){
  const cum=[0];
  for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+hav(coords[i-1][0],coords[i-1][1],coords[i][0],coords[i][1]));
  const out=[];
  tolls.forEach(t=>{
    const kx=Math.cos(t.lat*Math.PI/180)*111.32, ky=110.57;
    let best=Infinity, along=0;
    for(let i=1;i<coords.length;i++){
      const x1=(coords[i-1][1]-t.lon)*kx, y1=(coords[i-1][0]-t.lat)*ky;
      const x2=(coords[i][1]-t.lon)*kx,   y2=(coords[i][0]-t.lat)*ky;
      const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy;
      let u = L2 ? Math.max(0,Math.min(1,-(x1*dx+y1*dy)/L2)) : 0;
      const d=Math.hypot(x1+u*dx, y1+u*dy);
      if(d<best){ best=d; along=cum[i-1]+u*(cum[i]-cum[i-1]); }
    }
    if(best<=(t.radio||tolKm)) out.push({ toll:t, along, off:best });
  });
  return out.sort((p,q)=>p.along-q.along);
}

// Precio de una cabina según forma de pago y horario pico.
// El precio pico se aplica sobre TelePASE/beneficio, o sobre el valor general cuando la cabina no tiene precio TelePASE.
function tollPrice(t, opts){
  const tele = opts.telepase && t.telepase != null;
  let p = tele ? t.telepase : t.auto;
  if(opts.peak && t.pico != null && (tele || t.telepase == null)) p = t.pico;
  return p == null ? 0 : p;
}

// Las cabinas con sentido (por ejemplo la autopista Buenos Aires–La Plata) cobran solo en una dirección.
// 'ida' = el viaje se aleja del punto de referencia (CABA); 'vuelta' = se acerca.
function appliesToTrip(t, a, b){
  if(!t.sentido || !t.ref) return true;
  const alejandose = hav(t.ref.lat,t.ref.lon,b.lat,b.lon) > hav(t.ref.lat,t.ref.lon,a.lat,a.lon);
  return (t.sentido === 'ida') === alejandose;
}

// Autopistas con muchas cabinas seguidas (rampas de entrada y salida): un viaje no las paga todas.
// Se cuentan como máximo N por viaje (las de mayor precio). Regla a confirmar con la concesionaria.
const TOPES = { 'Acceso Oeste': 2, 'AU Illia': 2 };
function applyCaps(found, opts){
  const capped = [], drop = new Set();
  Object.keys(TOPES).forEach(ruta=>{
    const grupo = found.filter(f=>f.toll.ruta===ruta);
    if(grupo.length <= TOPES[ruta]) return;
    capped.push(ruta);
    grupo.slice().sort((p,q)=>tollPrice(q.toll,opts)-tollPrice(p.toll,opts)||p.along-q.along).slice(TOPES[ruta]).forEach(f=>drop.add(f));
  });
  return { found: found.filter(f=>!drop.has(f)), capped };
}

// Corredores (ruta + provincia) por los que pasa el viaje y que tienen otras cabinas todavía sin ubicar.
function incompleteCorridors(found, cabinas){
  const key = c => c.ruta+' ('+c.provincia+')';
  const pending = {}; cabinas.forEach(c=>{ if(c.lat==null) pending[key(c)]=true; });
  return [...new Set(found.map(f=>key(f.toll)))].filter(k=>pending[k]);
}

// Interpreta frases simples cuando no hay IA conectada.
function parseTrip(text){
  const n = norm(text);
  const m = n.match(/(?:\bde\b|\bdesde\b)\s+(.+?)\s+(?:\ba\b|\bhasta\b|\bhacia\b)\s+(.+?)(?=\s+(?:con|en|ida|y)\s|[,.;]|$)/);
  const otherVehicle = /moto|\bcamion(es)?\b|acoplado|trailer|casilla|colectivo|omnibus/.test(n);
  const telepase = /telepase|tele pase|tarjeta sanluisena|beneficio/.test(n);
  const roundTrip = /ida y vuelta|\bvuelta\b|regreso/.test(n);
  if(!m) return { origin:'', destination:'', telepase, otherVehicle, roundTrip };
  const nice = s => { const c=findCity(s); return c ? c.n : s.replace(/\b\w/g,l=>l.toUpperCase()); };
  return { origin:nice(m[1]), destination:nice(m[2]), telepase, otherVehicle, roundTrip };
}

const gmapsUrl = (a,b) => 'https://www.google.com/maps/dir/?api=1&origin='+a.lat+','+a.lon+'&destination='+b.lat+','+b.lon+'&travelmode=driving';
// </logic>

/* ========= RED: lugares y rutas ========= */
async function timedFetch(url, ms, opts){
  const ctl = new AbortController(); const id = setTimeout(()=>ctl.abort(), ms);
  try { return await fetch(url, Object.assign({signal:ctl.signal}, opts||{})); } finally { clearTimeout(id); }
}

async function resolvePlace(text){
  const c = findCity(text);
  if(c) return { lat:c.lat, lon:c.lon, label:c.n };
  try{
    const r = await timedFetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q='+encodeURIComponent(text), 8000);
    const j = await r.json();
    if(j && j[0]) return { lat:+j[0].lat, lon:+j[0].lon, label:text };
  }catch(e){}
  return null;
}

async function getRoute(a,b){
  try{
    const url='https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson';
    const r = await timedFetch(url, 10000); const j = await r.json();
    const rt = j.routes && j.routes[0];
    if(rt) return { coords: rt.geometry.coordinates.map(p=>[p[1],p[0]]), km: rt.distance/1000, min: rt.duration/60, source:'online' };
  }catch(e){}
  return offlineRoute(a,b);
}

/* ========= MAPA (SVG propio, con teselas de OpenStreetMap si hay conexión) ========= */
let lastTiles = [];
function drawMap(route, found, a, b){
  const W=640,H=320,pad=40;
  const pts=route.coords;
  let minLat=90,maxLat=-90,minLon=180,maxLon=-180;
  pts.concat([[a.lat,a.lon],[b.lat,b.lon]]).forEach(p=>{ minLat=Math.min(minLat,p[0]); maxLat=Math.max(maxLat,p[0]); minLon=Math.min(minLon,p[1]); maxLon=Math.max(maxLon,p[1]); });
  const merc=(lat,lon,z)=>{ const n=256*Math.pow(2,z), s=Math.sin(lat*Math.PI/180); return [(lon+180)/360*n, (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n]; };
  let z=13;
  for(; z>3; z--){ const p1=merc(maxLat,minLon,z), p2=merc(minLat,maxLon,z); if(p2[0]-p1[0]<=W-2*pad && p2[1]-p1[1]<=H-2*pad) break; }
  const tl=merc(maxLat,minLon,z), br=merc(minLat,maxLon,z);
  const ox=(W-(br[0]-tl[0]))/2-tl[0], oy=(H-(br[1]-tl[1]))/2-tl[1];
  const P=(lat,lon)=>{ const q=merc(lat,lon,z); return [q[0]+ox, q[1]+oy]; };
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mapa de la ruta">';
  for(let x=0;x<=W;x+=64) s+='<line class="m-grid" x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'"/>';
  for(let y=0;y<=H;y+=64) s+='<line class="m-grid" x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'"/>';
  const N=Math.pow(2,z);
  lastTiles = [];
  for(let tx=Math.floor(-ox/256); tx<=Math.floor((W-ox)/256); tx++){
    for(let ty=Math.floor(-oy/256); ty<=Math.floor((H-oy)/256); ty++){
      if(ty<0||ty>=N) continue;
      const wx=((tx%N)+N)%N;
      lastTiles.push({ url:TILE_URL.replace('{z}',z).replace('{x}',wx).replace('{y}',ty), x:tx*256+ox, y:ty*256+oy });
    }
  }
  s+='<g class="m-tiles"></g>';
  const step=Math.max(1,Math.ceil(pts.length/500));
  const line=pts.filter((_,i)=>i%step===0||i===pts.length-1).map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(',')).join(' ');
  s+='<polyline class="m-route-casing" points="'+line+'"/><polyline class="m-route" points="'+line+'"/>';
  found.forEach(f=>{ const q=P(f.toll.lat,f.toll.lon); s+='<rect class="m-toll'+(f.toll.ubic==='estimada'?' est':'')+'" x="'+(q[0]-6)+'" y="'+(q[1]-6)+'" width="12" height="12" rx="2"/>'; });
  const A=P(a.lat,a.lon), B=P(b.lat,b.lon);
  let shown=0;
  CITIES.forEach(c=>{
    const q=P(c.lat,c.lon);
    if(shown>=14 || q[0]<14||q[0]>W-14||q[1]<14||q[1]>H-14) return;
    if(Math.hypot(q[0]-A[0],q[1]-A[1])<26||Math.hypot(q[0]-B[0],q[1]-B[1])<26) return;
    shown++;
    s+='<circle class="m-city" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3"/><text class="m-city-t" x="'+(q[0]+6).toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'">'+esc(c.n)+'</text>';
  });
  s+='<circle class="m-a" cx="'+A[0]+'" cy="'+A[1]+'" r="12"/><text class="m-pin-t" x="'+A[0]+'" y="'+(A[1]+4.5)+'">A</text>';
  s+='<circle class="m-b" cx="'+B[0]+'" cy="'+B[1]+'" r="12"/><text class="m-pin-t" x="'+B[0]+'" y="'+(B[1]+4.5)+'">B</text>';
  s+='</svg>';
  return s;
}

// Descarga las teselas del mapa de calles. Si el servidor las rechaza (por ejemplo al abrir el archivo suelto desde la computadora),
// no se muestra nada raro: queda el mapa esquemático con la ruta, las ciudades y los peajes.
async function cargarTeselas(){
  const svg = $('r-svg').querySelector('svg'); if(!svg) return;
  const g = svg.querySelector('.m-tiles'); const tiles = lastTiles.slice(); let ok = 0;
  await Promise.all(tiles.map(async t=>{
    try{
      const r = await timedFetch(t.url, 10000); if(!r.ok) return;
      const url = URL.createObjectURL(await r.blob()); if(!svg.isConnected) return;
      const im = document.createElementNS('http://www.w3.org/2000/svg','image');
      im.setAttribute('href',url); im.setAttribute('x',t.x); im.setAttribute('y',t.y); im.setAttribute('width',256); im.setAttribute('height',256); im.setAttribute('opacity','.92');
      g.appendChild(im); ok++;
    }catch(e){}
  }));
  if(ok && svg.isConnected){
    const tx = document.createElementNS('http://www.w3.org/2000/svg','text');
    tx.setAttribute('class','m-attr'); tx.setAttribute('x',632); tx.setAttribute('y',312); tx.textContent='© OpenStreetMap';
    svg.appendChild(tx);
  }
}

/* ========= INTERFAZ ========= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const fmtTime = min => { const h=Math.floor(min/60), m=Math.round(min%60); return h? h+' h '+String(m).padStart(2,'0')+' min' : m+' min'; };

const lastTrip = { otherVehicle:false };
function setStatus(msg, isErr){ const el=$('status'); el.textContent=msg||''; el.className='status'+(isErr?' error':''); }

async function calculate(){
  const go=$('go'); go.disabled=true; setStatus('Buscando ruta…');
  try{
    const [a,b] = await Promise.all([resolvePlace($('from').value), resolvePlace($('to').value)]);
    if(!a || !b){ setStatus('No encontré '+(!a?'el origen':'el destino')+'. Probá con una ciudad de la lista.', true); return; }
    const route = await getRoute(a,b);
    const opts = { telepase: $('pay').value==='telepase', peak: $('peak').checked };
    const mult = $('round').checked ? 2 : 1;
    const located = TOLLS.cabinas.filter(c=>c.lat!=null);
    // Sin conexión la ruta es muy gruesa: solo se usan cabinas con radio de al menos 3 km (se excluyen autopistas urbanas y cruces caros).
    const pool = route.source==='online' ? located : located.filter(c=>(c.radio||7)>=3);
    const capRes = applyCaps(tollsOnRoute(route.coords, pool, 7).filter(f=>appliesToTrip(f.toll,a,b)), opts);
    const found = capRes.found;
    const total = found.reduce((s,f)=>s+tollPrice(f.toll,opts),0)*mult;
    const incompletos = incompleteCorridors(found, TOLLS.cabinas);

    $('r-total').textContent = money.format(total);
    $('r-meta').textContent = found.length+' peaje'+(found.length===1?'':'s')+(mult===2?' x2 (ida y vuelta)':'')+' · '+Math.round(route.km)+' km · '+fmtTime(route.min);
    const avisos=[];
    if(incompletos.length) avisos.push('Hay peajes de '+incompletos.join(', ')+' que todavía no tienen ubicación, así que el total puede estar incompleto.');
    if(capRes.capped.length) avisos.push('En '+capRes.capped.join(' y ')+' hay muchas cabinas seguidas (rampas): se cuentan como máximo '+Math.max(...capRes.capped.map(r=>TOPES[r]))+' por viaje.');
    const nEst = found.filter(f=>f.toll.ubic==='estimada').length;
    if(nEst) avisos.push(nEst+(nEst===1?' peaje de este viaje tiene':' peajes de este viaje tienen')+' ubicación estimada: se suman porque la ruta pasa por ese corredor, pero su posición exacta no está verificada.');
    if(route.source!=='online') avisos.push('La ruta es aproximada porque no hubo conexión con el servicio de rutas. Sin conexión no se calculan las autopistas de la Ciudad de Buenos Aires y pueden faltar peajes.');
    if(lastTrip.otherVehicle) avisos.push('Las tarifas son para auto o vehículo liviano de 2 ejes. Motos, acoplados y camiones pagan otros valores.');
    const banner=$('r-banner'); banner.hidden=!avisos.length; banner.textContent=avisos.join(' ');
    $('r-svg').innerHTML = drawMap(route, found, a, b);
    cargarTeselas();
    $('r-map').href = gmapsUrl(a,b);
    $('r-list').innerHTML = found.length
      ? found.map(f=>{
          const t=f.toll, tag=(opts.telepase&&t.telepase!=null?' · TelePASE':'')+(opts.peak&&t.pico!=null?' · pico':'');
          return '<li><span class="km">km '+Math.round(f.along)+'</span><span class="tn"><b>'+esc(t.nombre)+'</b><span>'+esc(t.ruta)+' · '+esc(t.provincia)+tag+(t.ubic==='estimada'?' · ubicación estimada':'')+'</span></span><span class="price">'+money.format(tollPrice(t,opts))+'</span></li>';
        }).join('')
      : '<li class="empty">No hay peajes cargados sobre esta ruta.</li>';
    const nVer = located.filter(c=>c.ubic==='verificada').length, nEst2 = located.length-nVer, sinUbic = TOLLS.cabinas.length-located.length;
    $('r-note').textContent = 'Tarifas al '+TOLLS.actualizado+' para '+(TOLLS.vehiculo||'auto').toLowerCase()+'. De '+TOLLS.cabinas.length+' peajes, '+nVer+' tienen ubicación verificada, '+nEst2+' estimada '+(sinUbic?'y '+sinUbic+' todavía no se suman por falta de ubicación.':'y ninguna queda sin ubicar.');
    $('result').hidden=false;
    setStatus('');
  }catch(e){
    setStatus('No se pudo calcular. Revisá la conexión e intentá de nuevo.', true);
  }finally{ go.disabled=false; }
}

async function interpret(){
  const text=$('ai-text').value.trim(); if(!text) return;
  $('ai-go').disabled=true;
  let t=null;
  if(AI_ENDPOINT){
    try{ const r=await timedFetch(AI_ENDPOINT,15000,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}); if(r.ok) t=await r.json(); }catch(e){}
  }
  if(!t) t=parseTrip(text);
  $('ai-go').disabled=false;
  if(!t.origin || !t.destination){ setStatus('No pude entender el origen y el destino. Escribilo como "de Rosario a Córdoba".', true); return; }
  $('from').value=t.origin; $('to').value=t.destination;
  $('pay').value = t.telepase ? 'telepase' : 'manual';
  $('round').checked=!!t.roundTrip;
  lastTrip.otherVehicle=!!t.otherVehicle;
  calculate();
}

async function loadTarifas(){
  for(const url of TOLLS_URLS){
    try{
      const r=await timedFetch(url,8000); const j=await r.json();
      if(j && Array.isArray(j.cabinas) && j.cabinas.length){ TOLLS=j; return true; }
    }catch(e){}
  }
  try{
    const j = JSON.parse(document.getElementById('tarifas-embebido').textContent);
    if(j && Array.isArray(j.cabinas) && j.cabinas.length){ TOLLS=j; return true; }
  }catch(e){}
  return false;
}

(function init(){
  $('cities').innerHTML = CITIES.map(c=>'<option value="'+esc(c.n)+'"></option>').join('');
  $('ai-mode').textContent = AI_ENDPOINT ? 'Interpretado con IA.' : 'Modo local: entiende frases simples como "de Rosario a Córdoba con TelePASE, ida y vuelta". Con el servicio de IA conectado entiende cualquier frase.';
  $('form').addEventListener('submit', e=>{ e.preventDefault(); lastTrip.otherVehicle=false; calculate(); });
  $('swap').addEventListener('click', ()=>{ const f=$('from').value; $('from').value=$('to').value; $('to').value=f; calculate(); });
  $('ai-go').addEventListener('click', interpret);
  loadTarifas().then(ok=>{ if(ok) calculate(); else setStatus('No se pudieron cargar las tarifas.', true); });
})();

/* NOTA PARA EL SERVIDOR DE IA (AI_ENDPOINT)
   Función serverless que guarda la clave de la API, recibe {text}, le pide al modelo que devuelva
   JSON {origin, destination, telepase, roundTrip, otherVehicle} y lo responde. La clave nunca va dentro del APK. */
</script>
